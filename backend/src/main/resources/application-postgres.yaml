spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/doorknock
    driver-class-name: org.postgresql.Driver
    username: doorknock
    password: doorknock

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data/insert_data.sql

  h2:
    console:
      enabled: false
