name: doorknock_Backend_CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: doorknock
          POSTGRES_USER: doorknock
          POSTGRES_PASSWORD: doorknock
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U doorknock -d doorknock"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/doorknock
      SPRING_DATASOURCE_USERNAME: doorknock
      SPRING_DATASOURCE_PASSWORD: doorknock
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_H2_CONSOLE_ENABLED: "false"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify backend directory exists
        run: |
          if [ ! -f backend/pom.xml ]; then
            echo "ERROR: backend/pom.xml not found in this commit."
            echo "The backend/ folder must be committed to the repository."
            ls -la
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Backend verify
        working-directory: backend
        run: ./mvnw -B clean verify
